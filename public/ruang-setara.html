.btn{display:inline-block;text-decoration:none}

.fchip{padding:3px 10px;font:500 .78rem Inter,sans-serif;border-radius:99px;background:var(--lav);color:var(--ink);margin:3px 2px}
.st-OPEN{background:#d6f0dd;color:#173d24}.st-CLOSED{background:#f3c6c0;color:#5a1d16}.st-UPDATED{background:#C3D6EF;color:#1f2f4a}
.heart{float:right;margin:-4px -4px 0 8px;font-size:1rem!important}
#a11yBtn{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;width:54px;height:54px;padding:0;font-size:1.5rem;background:var(--acc);color:#fff;box-shadow:0 6px 18px #0003}
[data-theme=dark] #a11yBtn{color:#1c1a29}

.arow{display:flex!important;justify-content:space-between;align-items:center;gap:10px;margin:10px 0!important;font-weight:400!important}.arow input{width:22px;height:22px;accent-color:var(--acc);flex:none}

.uimg{display:block;width:calc(100% + 40px);margin:-20px -20px 14px;height:170px;object-fit:cover;border-radius:20px 20px 0 0;background:var(--lav)}

.prof{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 14px}.pinfo{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;margin:0 0 10px}.pinfo span{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.bg{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 28px;margin-bottom:28px;box-shadow:0 2px 12px #4a4f9e14}.bg p{max-width:75ch}

.lvn{display:inline-block;min-width:2.6em;text-align:center;font:700 1.3rem Poppins,sans-serif;color:var(--acc);margin-left:6px}
#mlv{--p:50%;-webkit-appearance:none;appearance:none;height:12px;padding:0;border:0;border-radius:99px;background:linear-gradient(90deg,#FFC07A,#F6C9D8 50%,#4A4F9E) 0/var(--p) 100% no-repeat,var(--line);cursor:pointer}

[data-motion=off] .rv{opacity:1;transform:none}[data-motion=off] *,[data-motion=off] *::before,[data-motion=off] *::after{animation:none!important;transition:none!important}[data-motion=off]{scroll-behavior:auto}

let n=100,D={
home:{h:'Setiap Orang Berhak Bermimpi dan Menentukan Masa Depannya.',sub:'Kenali hakmu, temukan potensimu, dan temukan kesempatan yang setara untuk mewujudkan masa depanmu.',tes:'#',kinfo:KINFO0},
about:{title:'Latar Belakang Pembuatan Website',text:ABOUT0},

function dataHtml(){const f=S.df||'Semua',rows=D.leads.filter(x=>f=='Semua'||x.type==f);return`<div class="tabs">${['Semua','Eksplorasi','Cerita'].map(k=>`<button class="chip sm" aria-pressed="${f==k}" onclick="S.df='${k}';rAdm()">${k}</button>`).join('')} <button class="sm" onclick="csv()">Unduh CSV</button></div><p>Data dari form pengunjung (Eksplorasi dan Cerita). Total: <b>${D.leads.length}</b>. Kelola dengan hati-hati dan jangan dibagikan tanpa persetujuan.</p><div class="tw"><table><tr><th>Jenis</th><th>Nama</th><th>Kontak</th><th>Isi</th><th>Waktu</th><th>Tindak lanjut</th></tr>${[...rows].reverse().map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.name)}</td><td>${esc(x.contact)}</td><td>${esc(x.text)}</td><td>${esc(x.time)}</td><td><select aria-label="Status" onchange="leadSt('${x.id}',this.value)">${['Baru','Dihubungi','Selesai'].map(s=>`<option ${s==(x.st||'Baru')?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan=6>Belum ada data.</td></tr>'}</table></div>`}
async function csv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',d='Jenis,Nama,Kontak,Isi,Waktu,Status\n'+D.leads.map(x=>[x.type,x.name,x.contact,x.text,x.time,x.st||'Baru'].map(q).join(',')).join('\n');
try{const b=new Blob(['﻿'+d],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='data-ruang-setara.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('CSV diunduh ✓')}catch(e){try{await navigator.clipboard.writeText(d);toast('CSV disalin ke clipboard')}catch(_){alert(d)}}}
function rFoot(){const f=D.foot;$('#foot').innerHTML=`<div class="fgrid"><div><b class="fl">RUANG SETARA</b><p>Kenali Hakmu, Temukan Potensimu, Wujudkan Mimpimu.</p></div><div><b>Tentang Kami</b><p>${esc(f.about)}</p></div><div><b>Kontak</b><p>${esc(f.contact)}</p></div><div><b>Sosial Media</b><p>${esc(f.social)}</p></div></div><p><small>${esc(f.privacy)}</small></p><p>${esc(f.copy)}</p>`;persist()}
function resetAll(){if(!confirm(CLOUD?'Kembalikan konten situs (kartu, kampus, beasiswa, tim, beranda, footer) ke data contoh? Pesan, cerita, dan data siswa TIDAK dihapus.':'Kembalikan semua konten ke data contoh? Perubahan yang tersimpan di browser ini akan hilang.'))return;const d=JSON.parse(D0);if(CLOUD){CONTENT.forEach(k=>D[k]=d[k]);C.content();refresh();toast('Konten dikembalikan ke contoh awal');return}Object.keys(D).forEach(k=>delete D[k]);Object.assign(D,d);n=maxId();rPub();rAdm();rFoot();hdr();toast('Data dikembalikan ke contoh awal')}
function rAdm(){const afid=document.activeElement&&document.activeElement.id,akept=keepForm($('#admin'),/^ar$/);const tabs=['Overview','Inbox','Data','cards','quiz','stories','univ','sch','help','Info','team','Beranda','Footer'],L={Overview:'Overview',Inbox:'Ruang Aman (Chat)',Data:'Data Masuk',Info:'Akses Informasi',Beranda:'Beranda',Footer:'Footer'};
const nm=k=>L[k]||NAME[k];let b='';const t=S.aTab;
if(t=='Overview')b=`<div class="grid">${[['Kartu',D.cards.length],['Soal kuis',(D.quiz||[]).length],['Cerita',D.stories.length],['Kampus',D.univ.length],['Beasiswa',D.sch.length],['Pesan baru',D.msgs.filter(m=>m.status=='New').length],['Cerita pending',D.stories.filter(s=>s.st=='pending').length],['Data masuk',D.leads.length],['Total "Menginspirasi"',D.stories.reduce((a,s)=>a+(s.likes||0),0)]].map(([a,v])=>`<div class="card"><div class="stat">${v}</div>${a}</div>`).join('')}</div>
<div class="card" style="margin-top:16px"><b>Koneksi data</b><p>🟢 <b>Terhubung ke server.</b> Semua isian siswa dari HP/laptop mana pun masuk ke sini otomatis (diperbarui setiap beberapa detik). Biarkan tab ini terbuka untuk mendapat notifikasi pesan baru.</p><button class="sm danger" onclick="resetAll()">Reset ke data contoh</button></div>
<div class="card" style="margin-top:16px"><b>📧 Email notifikasi admin</b><p>Setiap ada siswa yang curhat di Ruang Aman, notifikasi dikirim ke email berikut. Email otomatis ditambahkan saat admin masuk.</p>${S.mailOn===false?'<p class="note">⚠️ Pengiriman email belum aktif di server. Notifikasi tetap muncul di halaman admin ini.</p>':''}
${(D.emails||[]).map((e,i)=>`<div class="row"><span>${esc(e)}</span><button class="sm danger" onclick="delEmail(${i})">Hapus</button></div>`).join('')||'<p>Belum ada email.</p>'}
<label for="newEm">Tambah email</label><div style="display:flex;gap:8px"><input id="newEm" type="email" placeholder="admin2@gmail.com"><button class="sm" onclick="addEmail()">Tambah</button></div>${S.mailOn?`<p style="margin-bottom:0"><button class="sm alt" onclick="testEmail()">✉️ Kirim email uji</button></p>`:''}${S.mailError?`<p class="note">⚠️ Email terakhir gagal terkirim: ${esc(S.mailError)}</p>`:''}</div>`;
else if(t=='Info')b=`<div class="card"><p>Bagian ini tampil di menu <b>Akses Informasi</b>, sebelum daftar tim.</p><label for="ab1">Judul</label><input id="ab1" value="${esc((D.about||{}).title)}"><label for="ab2">Latar belakang pembuatan website</label><textarea id="ab2" rows="10">${esc((D.about||{}).text)}</textarea><small>Pisahkan paragraf dengan satu baris kosong.</small><p><button onclick="D.about={title:$('#ab1').value,text:$('#ab2').value};C.content();rPub();toast('Latar belakang tersimpan ✓')">Simpan</button></p></div><p>Foto dan profil tim diatur di menu <button class="sm alt" onclick="S.aTab='team';rAdm()">Tim</button>.</p>`;
else if(t=='Inbox')b=inboxHtml();
else if(t=='Data')b=dataHtml();
else if(t=='Footer')b=`<div class="card">${[['about','Tentang Kami','t'],['contact','Kontak'],['social','Sosial media'],['privacy','Privacy Policy (ringkas)','t'],['copy','Copyright']].map(([k,l,ty])=>`<label for="ft${k}">${l}</label>`+(ty?`<textarea id="ft${k}" rows="2">${esc(D.foot[k])}</textarea>`:`<input id="ft${k}" value="${esc(D.foot[k])}">`)).join('')}<p><button onclick="['about','contact','social','privacy','copy'].forEach(k=>D.foot[k]=$('#ft'+k).value);rFoot();C.content();toast('Footer tersimpan ✓')">Simpan</button></p></div>`;
else if(t=='Beranda')b=`<div class="card"><label for="h1">Headline</label><input id="h1" value="${esc(D.home.h)}"><label for="h2">Subheadline</label><textarea id="h2" rows="2">${esc(D.home.sub)}</textarea><label for="h3">Link tes minat bakat</label><input id="h3" value="${esc(D.home.tes)}"><p><button onclick="D.home.tes=$('#h3').value;D.home.h=$('#h1').value;D.home.sub=$('#h2').value;C.content();rPub();toast('Tersimpan ✓ Lihat di situs.')">Simpan</button></p></div>`;
else b=(t=='univ'||t=='sch'?`<div class="card" style="margin-bottom:14px"><label for="ki" style="margin-top:0">💌 Teks info di bawah bagian Kampus &amp; Beasiswa</label><textarea id="ki" rows="3">${esc(D.home.kinfo??KINFO0)}</textarea><p style="margin-bottom:0"><button class="sm" onclick="D.home.kinfo=$('#ki').value;C.content();rPub();toast('Teks info tersimpan ✓')">Simpan teks</button></p></div>`:'')+`<p><button onclick="edit('${t}')">+ Tambah ${NAME[t]}</button></p>`+D[t].map(x=>`<div class="row"><span>${(t=='univ'||t=='team')&&imgOk(x.img)?`<img class="thumb" src="${esc(x.img)}" alt="">`:''}<b>${esc(String(x[TITLE[t]]??'').slice(0,90))}</b> <span class="badge">${esc(t=='stories'?x.st:t=='sch'?x.status:(x.on===false||x.verified===false)?'Draft':'Aktif')}</span></span><span><button class="sm alt" onclick="edit('${t}',${x.id})">Edit</button> <button class="sm alt" onclick="dup('${t}',${x.id})">Duplikat</button> ${CLOUD_ON&&t=='stories'?'':`<button class="sm alt" onclick="mv('${t}',${x.id})">↑</button> `}<button class="sm danger" onclick="del('${t}',${x.id})">Hapus</button></span></div>`).join('');
$('#admin').innerHTML=`<div class="adm"><div class="side" role="tablist">${tabs.map(k=>`<button aria-current="${S.aTab==k}" onclick="S.aTab='${k}';rAdm()">${nm(k)}${k=='Inbox'&&D.msgs.some(m=>m.unreadA)?' <span class="dot">'+D.msgs.filter(m=>m.unreadA).length+'</span>':''}</button>`).join('')}<button class="danger" onclick="logout()">Keluar</button></div><div><h2>${nm(t)}</h2>${b}</div></div>`;if(t==S.lastATab)restoreForm(akept);S.lastATab=t;if(afid){const e=document.getElementById(afid);if(e&&$('#admin').contains(e)){e.focus({preventScroll:true});caretEnd(e)}}persist()}
function testEmail(){toast('Mengirim email uji…');API.req('POST','/api/admin/test-email',{}).then(r=>{S.mailError=(r.errors||[]).join('\n');rAdm();toast(r.ok?'Email uji terkirim ✓ Cek kotak masuk (dan folder Spam).':'Sebagian email gagal: '+S.mailError)}).catch(fbErr)}
function saveEmails(l){API.req('PUT','/api/admin/emails',{emails:l}).then(r=>{D.emails=r.emails||[];rAdm();toast('Daftar email tersimpan ✓')}).catch(fbErr)}
function addEmail(){const v=$('#newEm').value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){toast('Format email belum benar.');return}saveEmails([...(D.emails||[]),v])}
function delEmail(i){if(confirm('Hapus email ini dari daftar notifikasi?'))saveEmails((D.emails||[]).filter((_,j)=>j!=i))}
function edit(t,id){const x=id?D[t].find(o=>o.id==id):{};open_(`<h3>${id?'Edit':'Tambah'} ${NAME[t]}</h3>`+SCH[t].map(([k,l,ty,o],i)=>{const v=x[k];return ty=='img'?`<label for="f${i}">${l}</label><div class="upimg"><img id="pv${i}" alt="Pratinjau gambar" ${imgOk(v)?`src="${esc(v)}"`:'class="hide"'}><div><input type="file" id="fu${i}" accept="image/jpeg,image/png,image/webp,image/gif" onchange="upImg(this,${i})" aria-label="Unggah ${esc(l.toLowerCase())}"><small id="fs${i}">JPG/PNG/WEBP, otomatis diperkecil. Atau tempel link gambar (https://) di bawah.</small><input id="f${i}" value="${esc(v)}" placeholder="https://… atau unggah file di atas" oninput="const p=$('#pv${i}');if(imgOk(this.value)){p.src=this.value;p.classList.remove('hide')}else p.classList.add('hide')"><button type="button" class="sm alt" style="margin-top:6px" onclick="$('#f${i}').value='';$('#pv${i}').classList.add('hide')">Hapus gambar</button></div></div>`:ty=='c'?`<label style="font-weight:400"><input type="checkbox" id="f${i}" style="width:auto" ${v!==false&&(v||!id)?'checked':''}> ${l}</label>`:`<label for="f${i}">${l}</label>`+(ty=='t'?`<textarea id="f${i}" rows="3">${esc(v)}</textarea>`:ty=='s'?`<select id="f${i}">${o.map(z=>`<option ${z==v?'selected':''}>${z}</option>`).join('')}</select>`:`<input id="f${i}" value="${esc(v)}">`)}).join('')+`<p><button onclick="save('${t}',${id||0})">Simpan</button> <button class="alt" onclick="$('#dlg').close()">Batal</button></p>`)}
/* Unggah gambar (kampus / foto tim): diperkecil di browser (maks 1280px) lalu disimpan di server. */
function shrink(file){return new Promise(res=>{if(file.type=='image/gif'||!/^image\//.test(file.type))return res(file);const im=new Image(),u=URL.createObjectURL(file);
 im.onload=()=>{URL.revokeObjectURL(u);const k=Math.min(1,1280/Math.max(im.width,im.height));if(k==1&&file.size<900e3)return res(file);const cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
  const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(im,0,0,cv.width,cv.height);cv.toBlob(b=>res(b||file),'image/jpeg',.85)};im.onerror=()=>{URL.revokeObjectURL(u);res(file)};im.src=u})}
async function upImg(inp,i){const f=inp.files&&inp.files[0];if(!f)return;const st=$('#fs'+i),sv=$('#dlg button[onclick^="save"]');st.textContent='⏳ Mengunggah gambar…';if(sv)sv.disabled=true;
 try{const b=await shrink(f);if(b.size>4*1024*1024)throw new Error('Ukuran gambar maksimal 4 MB.');const r=await fetch('/api/admin/upload',{method:'POST',headers:{'Content-Type':b.type||f.type,Authorization:'Bearer '+API.tok()},body:b});let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(j.error||('HTTP '+r.status));e.code=r.status;throw e}$('#f'+i).value=j.url;const p=$('#pv'+i);p.src=j.url;p.classList.remove('hide');st.textContent='✓ Gambar terunggah. Jangan lupa klik Simpan.'}
 catch(e){st.textContent='⚠️ '+(e.message||'Gagal mengunggah');if(e.code==401)fbErr(e)}finally{if(sv)sv.disabled=false;inp.value=''}}
function syncT(t,o,delId){if(CONTENT.includes(t))C.content();else if(t=='stories'){if(delId!=null)C.storyDel(delId);else if(o)C.story(o)}}
function save(t,id){const o=id?D[t].find(x=>x.id==id):{id:newId(),upd:today()};SCH[t].forEach(([k,,ty],i)=>o[k]=ty=='c'?$('#f'+i).checked:$('#f'+i).value);if('upd'in o)o.upd=today();if(!id)D[t].push(o);syncT(t,o);$('#dlg').close();rAdm();rPub();toast('Tersimpan ✓')}
function dup(t,id){const o={...D[t].find(x=>x.id==id),id:newId()};o[TITLE[t]]+=' (salinan)';if(t=='stories')o.likes=0;D[t].push(o);syncT(t,o);rAdm();rPub()}
function del(t,id){if(confirm('Hapus item ini?')){D[t]=D[t].filter(x=>x.id!=id);syncT(t,null,id);rAdm();rPub()}}
function mv(t,id){const a=D[t],i=a.findIndex(x=>x.id==id);if(i>0){[a[i-1],a[i]]=[a[i],a[i-1]];syncT(t);rAdm();rPub()}}

/* ---------- Event global ---------- */
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&!$('#a11y').classList.contains('hide')){a11yT(false);$('#a11yBtn').focus();return}
if(!pubMode||$('#dlg').open||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const h=$('#hak');if(!h)return;const r=h.getBoundingClientRect();
if(r.top<innerHeight*.6&&r.bottom>innerHeight*.3){if(e.key=='ArrowRight'){S.focus='cNext';nextCard(1)}if(e.key=='ArrowLeft'){S.focus='cPrev';nextCard(-1)}}});
addEventListener('scroll',onScroll,{passive:true});
$('#dlg').addEventListener('close',breathStop);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!A.theme)applyA()});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',applyA)}catch(e){}
addEventListener('storage',e=>{if(!CLOUD_ON&&e.key=='rs_D'&&e.newValue){try{const d=JSON.parse(e.newValue);Object.assign(D,d);n=maxId();if(pubMode)rPub();rAdm();rFoot();hdr()}catch(_){}}});
applyA();rPub();rAdm();rFoot();hdr();initCloud();
</script></body></html>
